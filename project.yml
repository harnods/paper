name: Paper
options:
  bundleIdPrefix: com.paper
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Paper:
    type: application
    platform: [iOS, macOS]
    sources:
      - Paper
    settings:
      base:
        PRODUCT_NAME: Paper
        PRODUCT_BUNDLE_IDENTIFIER: com.paper.app
        INFOPLIST_FILE: Paper/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Paper
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  Paper_macOS:
    build:
      targets:
        Paper_macOS: all
  Paper_iOS:
    build:
      targets:
        Paper_iOS: all
